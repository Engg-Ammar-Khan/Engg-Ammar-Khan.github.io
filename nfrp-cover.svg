<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter,Helvetica,Arial,sans-serif">
 <defs>
  <radialGradient id="mx" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#16304d"/><stop offset="1" stop-color="#0d1b2a"/></radialGradient>
  <linearGradient id="fib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c27a"/><stop offset=".5" stop-color="#a88a3d"/><stop offset="1" stop-color="#6e5a26"/></linearGradient>
  <pattern id="mf" width="14" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><line x1="0" y1="3" x2="14" y2="3" stroke="#f4e3a8" stroke-opacity=".35" stroke-width="1.2"/></pattern>
 </defs>
 <rect width="800" height="400" fill="url(#mx)"/>
 <g opacity=".18" stroke="#7cc4ff">
  <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800" stroke-width=".6"/>
 </g>
 <!-- cross-section of a plant fibre -->
 <g transform="translate(190 205)">
  <circle r="150" fill="#5b7a3a" opacity=".25"/>
  <circle r="132" fill="#7a9a44"/>
  <circle r="122" fill="#9cbc55"/>
  <circle r="112" fill="#c9a94b"/>
  <circle r="58" fill="#e3c86a"/>
  <circle r="50" fill="#0d1b2a"/>
  <g stroke="#f4e3a8" stroke-opacity=".45" stroke-width="1.3">
   <path d="M0 -110 L0 -60 M78 -78 L42 -42 M110 0 L60 0 M78 78 L42 42 M0 110 L0 60 M-78 78 L-42 42 M-110 0 L-60 0 M-78 -78 L-42 -42"/>
   <path d="M39 -102 L21 -55 M102 -39 L55 -21 M102 39 L55 21 M39 102 L21 55 M-39 102 L-21 55 M-102 39 L-55 21 M-102 -39 L-55 -21 M-39 -102 L-21 -55"/>
  </g>
  <g fill="#f1f5f9" font-size="14" font-weight="700">
   <text x="0" y="5" text-anchor="middle" font-size="12" fill="#94a3b8">lumen</text>
   <text x="0" y="-80" text-anchor="middle">S2</text>
  </g>
  <g stroke="#f1f5f9" stroke-width="1" fill="#f1f5f9" font-size="13">
   <line x1="118" y1="-48" x2="190" y2="-118"/><text x="194" y="-120">primary wall</text>
   <line x1="127" y1="-10" x2="190" y2="-70"/><text x="194" y="-66">S1</text>
   <line x1="40" y1="-34" x2="190" y2="-22"/><text x="194" y="-18">S3</text>
  </g>
 </g>
 <!-- interface zoom: fibre surface vs matrix -->
 <g transform="translate(470 70)">
  <rect width="300" height="260" rx="14" fill="#0b1726" stroke="#233d5c"/>
  <rect x="0" y="150" width="300" height="110" rx="14" fill="url(#fib)"/>
  <rect x="0" y="150" width="300" height="110" fill="url(#mf)"/>
  <rect x="0" y="150" width="300" height="14" fill="#a88a3d"/>
  <text x="16" y="242" fill="#1d1606" font-size="14" font-weight="700">fibre (cellulose –OH)</text>
  <text x="16" y="32" fill="#94a3b8" font-size="14" font-weight="700">polymer matrix</text>
  <!-- untreated: weak, gap -->
  <g>
   <text x="16" y="70" fill="#ff8a65" font-size="13" font-weight="700">untreated</text>
   <path d="M20 150 q15 -26 30 0 q15 -26 30 0 q15 -26 30 0" fill="none" stroke="#ff8a65" stroke-width="2" stroke-dasharray="4 4"/>
   <g fill="#ff8a65" font-size="12"><text x="22" y="136">OH</text><text x="72" y="136">OH</text><text x="112" y="136">OH</text></g>
  </g>
  <!-- treated: covalent bonds -->
  <g>
   <text x="170" y="70" fill="#4fd1a5" font-size="13" font-weight="700">silane-treated</text>
   <g stroke="#4fd1a5" stroke-width="2.4">
    <line x1="185" y1="150" x2="185" y2="96"/><line x1="225" y1="150" x2="225" y2="96"/><line x1="265" y1="150" x2="265" y2="96"/>
   </g>
   <g fill="#0b1726" stroke="#4fd1a5" stroke-width="2"><circle cx="185" cy="122" r="11"/><circle cx="225" cy="122" r="11"/><circle cx="265" cy="122" r="11"/></g>
   <g fill="#4fd1a5" font-size="10" font-weight="700" text-anchor="middle"><text x="185" y="126">Si</text><text x="225" y="126">Si</text><text x="265" y="126">Si</text></g>
  </g>
  <line x1="150" y1="50" x2="150" y2="150" stroke="#233d5c" stroke-dasharray="3 4"/>
 </g>
 <text x="470" y="360" fill="#7cc4ff" font-size="15" font-weight="700">Reported IFSS gain with silane: +40–65 %</text>
</svg>
